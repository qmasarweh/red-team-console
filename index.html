<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Local ethical red-team chat console powered by Ollama" />
  <title>Red Team Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="shell">
    <aside class="history">
      <div class="history-head">
        <span>Chats</span>
        <button type="button" id="newChat" class="ghost compact">New</button>
      </div>
      <ul id="chatList" class="chat-list"></ul>
    </aside>

    <div class="main-col">
      <header class="top">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <div>
            <h1>Red Team Console</h1>
            <p class="sub" id="chatTitle">Local Ollama · history · memory</p>
          </div>
        </div>
        <div class="top-actions">
          <div class="status" id="status">Checking Ollama…</div>
          <button type="button" id="openMemory" class="ghost">Memory</button>
          <button type="button" id="openFiles" class="ghost">Files</button>
          <button type="button" id="openSettings" class="ghost">Settings</button>
          <button type="button" id="deleteChat" class="ghost danger">Delete</button>
        </div>
      </header>

      <main class="chat">
        <div id="messages" class="messages" aria-live="polite"></div>
        <div id="activity" class="activity" hidden></div>
        <form id="composer" class="composer">
          <textarea
            id="input"
            rows="2"
            placeholder="Chat, build into files/, search the web, or say “remember that…”"
            required
          ></textarea>
          <div class="composer-actions">
            <button type="button" id="stop" class="ghost" hidden>Stop</button>
            <button type="submit" id="send">Send</button>
          </div>
        </form>
      </main>
    </div>
  </div>

  <div id="settingsModal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h2>Settings</h2>
        <button type="button" class="ghost" id="closeSettings">Close</button>
      </div>
      <label class="field">
        <span>Ollama model</span>
        <select id="model"></select>
      </label>
      <p class="hint">Installed models from your local Ollama.</p>
      <label class="field grow">
        <span>System prompt</span>
        <textarea id="system" rows="14" spellcheck="false"></textarea>
      </label>
      <div class="modal-actions">
        <button type="button" id="resetPrompt" class="ghost">Reset prompt</button>
        <button type="button" id="saveSettings" class="primary">Save</button>
      </div>
    </div>
  </div>

  <div id="memoryModal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h2>Memory</h2>
        <button type="button" class="ghost" id="closeMemory">Close</button>
      </div>
      <p class="hint">Facts kept across all chats. The model can also save/forget with tools.</p>
      <ul id="memoryList" class="memory-list"></ul>
      <form id="memoryForm" class="memory-form">
        <input id="memoryInput" type="text" placeholder="Add a memory…" required />
        <button type="submit" class="primary">Add</button>
      </form>
    </div>
  </div>

  <div id="filesModal" class="modal" hidden>
    <div class="modal-card files-card">
      <div class="modal-head">
        <h2>files/ workspace</h2>
        <button type="button" class="ghost" id="closeFiles">Close</button>
      </div>
      <div class="files-toolbar">
        <button type="button" id="refreshFiles" class="ghost">Refresh</button>
        <span id="filesCount" class="muted"></span>
      </div>
      <ul id="filesList" class="files-list"></ul>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
